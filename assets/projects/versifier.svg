<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Versifier: from a prompt to a sonnet</title>
  <desc id="desc">Architecture illustration of LSTM and GPT-2 generation, with four lines of the documented GPT-2 sample from Code/report.py. This is not a live model run.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f5f0ff"/><stop offset="1" stop-color="#e2e8ff"/></linearGradient></defs>
  <rect width="1200" height="900" fill="#131426"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="60" y="84" fill="#bab4ea" font-size="19" letter-spacing="3">LANGUAGE MODELS / CREATIVE TEXT</text>
    <text x="56" y="164" fill="#faf8ff" font-size="66" font-weight="700">Versifier</text>
    <text x="60" y="212" fill="#c5c1d9" font-size="26">A prompt. Two models. Fourteen lines.</text>
    <rect x="60" y="259" width="1080" height="86" rx="16" fill="#29273f" stroke="#55506e"/>
    <text x="88" y="310" fill="#e7e1ff" font-size="26">PROMPT</text>
    <text x="270" y="310" fill="#fff" font-size="28">“Shall I compare thee”</text>
    <path d="M600 347v32m0 0H310v24m290-24h290v24" fill="none" stroke="#a99be5" stroke-width="3"/>
    <rect x="60" y="405" width="510" height="105" rx="16" fill="#25263e" stroke="#62668a"/>
    <rect x="600" y="405" width="540" height="105" rx="16" fill="#35304c" stroke="#b9a5ec"/>
    <text x="88" y="448" fill="#eeeaff" font-size="27" font-weight="700">Character LSTM</text>
    <text x="88" y="482" fill="#b9bed8" font-size="20">Embedding → 2 recurrent layers → characters</text>
    <text x="630" y="448" fill="#eeeaff" font-size="27" font-weight="700">Fine-tuned GPT-2</text>
    <text x="630" y="482" fill="#d1c4ed" font-size="20">Sonnet training → sampling → line formatting</text>
    <rect x="60" y="550" width="1080" height="270" rx="18" fill="url(#paper)"/>
    <text x="92" y="590" fill="#565074" font-size="17" letter-spacing="2">DOCUMENTED GPT-2 SAMPLE / EXCERPT</text>
    <g font-family="DejaVu Serif, Georgia, serif" fill="#262238" font-size="27">
      <text x="92" y="639">Shall I compare thee with the spring, When</text>
      <text x="92" y="682">In tender embassy doth my sweet</text>
      <text x="92" y="725">Love grow? O! from what temperate sway</text>
      <text x="92" y="768">Do you hold; And who is so sovereign</text>
    </g>
    <text x="60" y="864" fill="#ada7c3" font-size="18">Architecture illustration + sample recorded in Code/report.py; no new inference run.</text>
  </g>
</svg>
