<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">RGMC SimSort region-aware planning</title><desc id="desc">Seven lookup views feed detection and geometry, then five region-specific planning strategies and class-based sorting.</desc><rect width="1200" height="900" fill="#101827"/><g font-family="DejaVu Sans, sans-serif"><text x="54" y="65" fill="#67e8f9" font-size="18" font-weight="400">ROBOTIC MANIPULATION / WORKSPACE STRATEGY</text><text x="54" y="130" fill="#f1f5f9" font-size="54" font-weight="700">RGMC SimSort</text><text x="54" y="176" fill="#b5c4d8" font-size="27" font-weight="400">Observe locally. Plan by region. Sort by class.</text><text x="54" y="230" fill="#a5b9d2" font-size="19" font-weight="400">SEVEN LOOKUP VIEWS</text><circle cx="100" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="93" y="282" fill="#e8f0fb" font-size="23" font-weight="400">1</text><circle cx="192" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="185" y="282" fill="#e8f0fb" font-size="23" font-weight="400">2</text><circle cx="284" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="277" y="282" fill="#e8f0fb" font-size="23" font-weight="400">3</text><circle cx="376" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="369" y="282" fill="#e8f0fb" font-size="23" font-weight="400">4</text><circle cx="468" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="461" y="282" fill="#e8f0fb" font-size="23" font-weight="400">5</text><circle cx="560" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="553" y="282" fill="#e8f0fb" font-size="23" font-weight="400">6</text><circle cx="652" cy="274" r="26" fill="#243e59" stroke="#67e8f9"/><text x="645" y="282" fill="#e8f0fb" font-size="23" font-weight="400">7</text><text x="800" y="281" fill="#b5c4d8" font-size="23" font-weight="400">Independent detections</text><path d="M600 310 L600 345" stroke="#7992b4" stroke-wi