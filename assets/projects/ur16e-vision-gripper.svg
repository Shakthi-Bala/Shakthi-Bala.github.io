<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">UR16e vision, MoveIt, and gripper integration</title><desc id="desc">External object positions or fixed demo poses become action goals, MoveIt motion plans, and gripper service requests.</desc><rect width="1200" height="900" fill="#101827"/><g font-family="DejaVu Sans, sans-serif"><text x="54" y="65" fill="#67e8f9" font-size="18" font-weight="400">ROS 1 / MANIPULATION SYSTEMS</text><text x="54" y="130" fill="#f1f5f9" font-size="54" font-weight="700">UR16e integration</text><text x="54" y="176" fill="#b5c4d8" font-size="25" font-weight="400">Object poses → planned arm motion → tool actuation</text><rect x="54" y="220" width="510" height="105" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="76" y="259" fill="#67e8f9" font-size="26" font-weight="700">Object-location interface</text><text x="76" y="296" fill="#b5c4d8" font-size="19" font-weight="400">PointStamped / deprojection service</text><rect x="636" y="220" width="510" height="105" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="658" y="259" fill="#67e8f9" font-size="26" font-weight="700">Demonstration poses</text><text x="658" y="296" fill="#b5c4d8" font-size="19" font-weight="400">Fixed pick/place coordinates</text><path d="M310 326v28h580v-28M600 354v30" fill="none" stroke="#7992b4" stroke-width="3"/><rect x="240" y="386" width="720" height="102" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="262" y="425" fill="#67e8f9" font-size="26" font-weight="700">Task client → action server</text><text x="262" y="462" fill="#b5c4d8" font-size="19" font-weight="400">Start / destination goals · feedback · result</text><path d="M600 490 L600 520" stroke="#7992b4" stroke-width="3"/><path d="M593 510 L600 520 L607 510" fill="none" stroke="#7992b4" stroke-width="3"/><rect x="54" y="526" width="510" height="105" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="76" y="565" fill="#67e8f9" font-size="26" font-weight="700">MoveIt / manipulator</text><text x="76" y="602" fill="#b5c4d8" font-size="19" font-weight="400">Pose targets → plan → execute</text><rect x="636" y="526" width="510" height="105" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="658" y="565" fill="#f7c67e" font-size="26" font-weight="700">Gripper service + serial bridge</text><text x="658" y="602" fill="#b5c4d8" font-size="19" font-weight="400">Boolean requests → periodic setpoints</text><path d="M600 490v24h-290v12M600 514h290v12" fill="none" stroke="#7992b4" stroke-width="3"/><text x="54" y="687" fill="#a5b9d2" font-size="19" font-weight="400">STAGED TASK SEQUENCE</text><rect x="54" y="711" width="258" height="108" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="76" y="750" fill="#67e8f9" font-size="26" font-weight="700">01  Approach</text><text x="76" y="787" fill="#b5c4d8" font-size="19" font-weight="400">Plan above target</text><rect x="332" y="711" width="258" height="108" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="354" y="750" fill="#f7c67e" font-size="26" font-weight="700">02  Grasp</text><text x="354" y="787" fill="#b5c4d8" font-size="19" font-weight="400">Descend + close</text><rect x="610" y="711" width="258" height="108" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="632" y="750" fill="#67e8f9" font-size="26" font-weight="700">03  Transfer</text><text x="632" y="787" fill="#b5c4d8" font-size="19" font-weight="400">Move to placement</text><rect x="888" y="711" width="258" height="108" rx="16" fill="#1c2b40" stroke="#3b506c"/><text x="910" y="750" fill="#f7c67e" font-size="26" font-weight="700">04  Release</text><text x="910" y="787" fill="#b5c4d8" font-size="19" font-weight="400">Open gripper</text><text x="54" y="872" fill="#a5b9d2" font-size="18" font-weight="400">Source-code architecture illustration; hardware execution is not shown.</text></g></svg>
